<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW5</title>
</head>

<body>
    <div class="show">
        <div class="data">
            <div class="tree-container">
                <div class="tree-node">
                    <button class="toggle-btn" isDisplayed="false">+</button>
                    <div class="tree-serial">1</div>
                    <div class="node-data">节点内容</div>
                </div>
            </div>
        </div>
        <div>
            <div class="students">
                <div class="student" id="female" style="display: flex;">
                    <div class="serial">1</div>
                    <div class="card">#12314142</div>
                    <div class="name">Alex</div>
                    <div class="grade" id="failed">0</div>
                </div>

                <div class="student" id="male" style="display: flex;">
                    <div class="serial">1</div>
                    <div class="card">#12314142</div>
                    <div class="name">Alex</div>
                    <div class="grade" id="passed">0</div>
                </div>



            </div>
            <button class="load">Load Data</button>
        </div>
    </div>



</body>

<style>
    .node-data {
        margin-left: 1vmin;
        color: rgb(85, 85, 85);
        font-size: larger;
        align-items: center;
    }

    .toggle-btn:hover {
        background-color: rgb(220, 220, 220);
        cursor: pointer;
    }

    .toggle-btn[isDisplayed="true"] {
        background-color: rgb(200, 200, 200);
    }

    .toggle-btn {
        font-size: x-large;
        height: 3vmin;
        width: 3vmin;
        border: 1px dotted rgb(136, 136, 136);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 1vmin;
        background-color: white;
        border-radius: 0.5vmin;
        margin-right: 1vmin;

    }

    .tree-serial {
        color: white;
        height: 4vmin;
        width: 4vmin;
        border-radius: 4vmin;
        text-align: center;
        line-height: 4vmin;
        margin-left: 0vmin;
        background-color: rgb(0, 0, 255);
    }

    .tree-children {
        clear: left;
        margin-left: 4vmin;
        flex-direction: column;
        display: block;
    }

    .tree-node {
        align-items: center;
        display: flex;
        margin-top: 0.5vmin;
        margin-left: 0vmin;

    }

    .tree-container {
        overflow: auto;
        display: block;

    }

    .show {
        display: flex;
    }

    .student {
        display: flex;
        align-items: center;
        margin-top: 1.5vmin;
    }

    .grade {
        color: red;
        font-size: large;
        font-weight: bolder;
        /* border: 1px solid black; */
        height: auto;
        width: auto;
        text-align: end;
        line-height: 5vmin;
        margin-left: auto;
        margin-right: 1vmin;
    }

    .name {
        /* border: 1px solid black; */
        height: auto;
        width: auto;
        /* margin: 2vmin 0 2vmin 2vmin; */
        margin-left: 1vmin;

    }

    .card {
        /* border: 1px solid black; */
        height: auto;
        width: auto;
        /* margin: 2vmin 0 2vmin 2vmin; */
        margin-left: 1vmin;

    }

    .serial {
        color: white;
        /* border: 1px solid black; */
        height: 4vmin;
        width: 4vmin;
        border-radius: 4vmin;
        text-align: center;
        line-height: 4vmin;
        /* margin: 2vmin 0 2vmin 2vmin; */
        margin-left: 1vmin;
        background-color: rgb(0, 0, 255);
    }

    /* .students>.student:first-of-type>.serial {
        background-color: rgb(255, 0, 255);
    } */
    #female .serial {
        background-color: rgb(255, 0, 255);
    }

    #passed {
        color: rgb(1, 171, 1);
    }

    #failed {
        color: rgb(255, 0, 0);
    }

    .data {
        width: 50vmin;
        height: 60vmin;
        border: 1px solid black;
    }

    .students {
        margin: 0 0 0 2vmin;
        width: 50vmin;
        height: 45vmin;
        border: 1px solid black;
        display: block;
        overflow: auto;
    }

    /* 居中显示 */
    .load {
        display: block;
        margin: 2vmin auto 0 auto;
    }
</style>

<script>
    // http://ext.gaomuxuexi.com:5870/task/random
    document.querySelector('.load').onclick = function () {
        // 使用原生ajax
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "http://ext.gaomuxuexi.com:5870/task/random", false);
        xhr.send();
        // console.log(xhr.status + ":" + xhr.responseText);
        result = JSON.parse(xhr.responseText);
        // console.log(result);
        if (result.no === 500) {
            alert(result.msg);
            return;
        }

        const students = result.list || [];
        const studentsContainer = document.querySelector('.students');
        studentsContainer.innerHTML = ''; // 清空现有内容
        students.forEach((student, index) => {
            const studentDiv = document.createElement('div');
            studentDiv.className = 'student';
            if (result.list[index].gender === 1) {
                studentDiv.id = 'female';
            } else {
                studentDiv.id = 'male';
            }
            studentDiv.style.display = 'flex';
            const serialDiv = document.createElement('div');
            serialDiv.className = 'serial';
            serialDiv.innerText = index + 1;
            if (index === 0) {
                serialDiv.style.backgroundColor = 'rgb(255, 0, 255)';
            }
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            cardDiv.innerText = "#" + student.sno;
            const nameDiv = document.createElement('div');
            nameDiv.className = 'name';
            nameDiv.innerText = student.name;
            const gradeDiv = document.createElement('div');
            if (student.score >= 60) {
                gradeDiv.id = 'passed';
            } else {
                gradeDiv.id = 'failed';
            }
            gradeDiv.className = 'grade';
            gradeDiv.innerText = student.score;
            studentDiv.appendChild(serialDiv);
            studentDiv.appendChild(cardDiv);
            studentDiv.appendChild(nameDiv);
            studentDiv.appendChild(gradeDiv);
            studentsContainer.appendChild(studentDiv);
        });


        // 处理树状结构数据
        const treeData = result.tree || [];
        console.log(treeData);
        console.log(treeData.N);
        console.log(treeData.C);
        // 生成树状结构
        const treeContainer = document.querySelector('.tree-container');
        treeContainer.innerHTML = ''; // 清空现有内容
        function createTreeNode(nodeData, level = 1) {
            const treeNodeDiv = document.createElement('div');
            treeNodeDiv.className = 'tree-node';
            // 判断是否为根节点 根节点显示 子节点隐藏
            treeNodeDiv.style.display = level === 1 ? 'flex' : 'none';

            // 创建展开按钮 默认为不展示 无子节点则隐藏
            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'toggle-btn';
            toggleBtn.setAttribute('isDisplayed', 'false');
            toggleBtn.innerText = '+';
            if (!nodeData.C || nodeData.C.length === 0) {
                toggleBtn.style.visibility = 'hidden';
            }


            const treeSerialDiv = document.createElement('div');
            treeSerialDiv.className = 'tree-serial';
            treeSerialDiv.innerText = nodeData.id;

            const nodeDataDiv = document.createElement('div');
            nodeDataDiv.className = 'node-data';
            nodeDataDiv.innerText = nodeData.N;

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children';


            treeNodeDiv.appendChild(toggleBtn);
            treeNodeDiv.appendChild(treeSerialDiv);
            treeNodeDiv.appendChild(nodeDataDiv);
            treeNodeDiv.appendChild(childrenContainer);

            // 递归创建子节点
            if (nodeData.C && nodeData.C.length > 0) {
                nodeData.C.forEach(childNode => {
                    const childTreeNode = createTreeNode(childNode, level + 1);
                    childrenContainer.appendChild(childTreeNode);
                });
            }

            return treeNodeDiv;
        }


        const rootNode = createTreeNode(treeData);
        treeContainer.appendChild(rootNode);

        // 节点展开按钮
        const toggleButtons = document.querySelectorAll('.toggle-btn');
        toggleButtons.forEach(button => {
            button.onclick = function () {
                const isDisplayed = this.getAttribute('isDisplayed');
                if (isDisplayed === 'true') {
                    this.setAttribute('isDisplayed', 'false');
                    this.innerText = '+';
                    // 修改子节点显示状态
                    const parentNode = this.parentNode;
                    const childNodes = parentNode.querySelectorAll('.tree-node');
                    childNodes.forEach(childNode => {
                        childNode.style.display = 'none';
                    });
                } else {
                    this.setAttribute('isDisplayed', 'true');
                    this.innerText = '-';
                    // 修改子节点显示状态
                    const parentNode = this.parentNode;
                    const childNodes = parentNode.querySelectorAll('.tree-node');
                    childNodes.forEach(childNode => {
                        childNode.style.display = 'flex';
                    });
                }
            };
        });
    };
</script>

</html>
