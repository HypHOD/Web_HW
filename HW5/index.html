<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW5</title>
</head>

<body>
    <div class="show">
        <div class="data"></div>
        <div>
            <div class="students">
                <div class="student" id="female" style="display: flex;">
                    <div class="serial">1</div>
                    <div class="card">#12314142</div>
                    <div class="name">Alex</div>
                    <div class="grade" id="failed">0</div>
                </div>

                <div class="student" id="male" style="display: flex;">
                    <div class="serial">1</div>
                    <div class="card">#12314142</div>
                    <div class="name">Alex</div>
                    <div class="grade" id="passed">0</div>
                </div>



            </div>
            <button class="load">Load Data</button>
        </div>
    </div>



</body>

<style>
    .show {
        display: flex;
    }

    .student {
        display: flex;
        align-items: center;
        margin-top: 1.5vmin;
    }

    .grade {
        color: red;
        font-size: large;
        font-weight: bolder;
        border: 1px solid black;
        height: auto;
        width: auto;
        text-align: end;
        line-height: 5vmin;
        margin-left: auto;
        margin-right: 1vmin;
    }

    .name {
        border: 1px solid black;
        height: auto;
        width: auto;
        /* margin: 2vmin 0 2vmin 2vmin; */
        margin-left: 1vmin;

    }

    .card {
        border: 1px solid black;
        height: auto;
        width: auto;
        /* margin: 2vmin 0 2vmin 2vmin; */
        margin-left: 1vmin;

    }

    .serial {
        color: white;
        border: 1px solid black;
        height: 5vmin;
        width: 10%;
        border-radius: 5vmin;
        text-align: center;
        line-height: 5vmin;
        /* margin: 2vmin 0 2vmin 2vmin; */
        margin-left: 2vmin;
        background-color: rgb(0, 0, 255);
    }

    /* .students>.student:first-of-type>.serial {
        background-color: rgb(255, 0, 255);
    } */
    #female .serial {
        background-color: rgb(255, 0, 255);
    }

    #passed {
        color: rgb(1, 171, 1);
    }

    #failed {
        color: rgb(255, 0, 0);
    }

    .data {
        width: 50vmin;
        height: 60vmin;
        border: 1px solid black;
    }

    .students {
        margin: 0 0 0 2vmin;
        width: 50vmin;
        height: 45vmin;
        border: 1px solid black;
        display: block;
        overflow: auto;
    }

    /* 居中显示 */
    .load {
        display: block;
        margin: 2vmin auto 0 auto;
    }
</style>

<script>
    // http://ext.gaomuxuexi.com:5870/task/random
    document.querySelector('.load').onclick = function () {
        // 使用原生ajax
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "http://ext.gaomuxuexi.com:5870/task/random", false);
        xhr.send();
        // console.log(xhr.status + ":" + xhr.responseText);
        result = JSON.parse(xhr.responseText);
        console.log(result);
        if (result.no === 500) {
            alert(result.msg);
            return;
        }
        const students = result.list || [];
        const studentsContainer = document.querySelector('.students');
        studentsContainer.innerHTML = ''; // 清空现有内容
        students.forEach((student, index) => {
            const studentDiv = document.createElement('div');
            studentDiv.className = 'student';
            if (result.list[index].gender === 1) {
                studentDiv.id = 'female';
            } else {
                studentDiv.id = 'male';
            }
            studentDiv.style.display = 'flex';
            const serialDiv = document.createElement('div');
            serialDiv.className = 'serial';
            serialDiv.innerText = index + 1;
            if (index === 0) {
                serialDiv.style.backgroundColor = 'rgb(255, 0, 255)';
            }
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            cardDiv.innerText = "#" + student.sno;
            const nameDiv = document.createElement('div');
            nameDiv.className = 'name';
            nameDiv.innerText = student.name;
            const gradeDiv = document.createElement('div');
            if (student.score >= 60) {
                gradeDiv.id = 'passed';
            } else {
                gradeDiv.id = 'failed';
            }
            gradeDiv.className = 'grade';
            gradeDiv.innerText = student.score;
            studentDiv.appendChild(serialDiv);
            studentDiv.appendChild(cardDiv);
            studentDiv.appendChild(nameDiv);
            studentDiv.appendChild(gradeDiv);
            studentsContainer.appendChild(studentDiv);
        });
        // 渲染树形图

    };
</script>

</html>
