<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW6</title>
</head>

<body>
    <div>
        <div class="show">
            <div class="tree-container">
                <div class="tree-node"></div>
            </div>
            <div class="lists"></div>
        </div>
        <div class="btn-dialog"
            style="margin-top: 1vmin; display:flex; margin-left: auto; justify-content: flex-end; gap: 5px;">
            <button class="download">刷新</button>
            <button class="upload">提交</button>
        </div>
    </div>




</body>

<style>
    .node-data {
        margin-left: 1vmin;
        color: rgb(85, 85, 85);
        font-size: larger;
        align-items: center;
        overflow: hidden;
        width: fit-content;
    }

    .toggle-btn:hover {
        background-color: rgb(220, 220, 220);
        cursor: pointer;
    }

    .toggle-btn[isDisplayed="true"] {
        background-color: rgb(200, 200, 200);
    }

    .toggle-btn {
        font-size: x-large;
        height: 3vmin;
        width: 3vmin;
        border: 1px dotted rgb(136, 136, 136);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 1vmin;
        background-color: white;
        border-radius: 0.5vmin;
        margin-right: 1vmin;
    }

    .tree-serial {
        color: white;
        height: 4vmin;
        width: 4vmin;
        /* border-radius: 4vmin; */
        text-align: center;
        line-height: 4vmin;
        margin-left: 0vmin;
        border: 1px solid blue;
        /* background-color: rgb(0, 0, 255); */
    }

    .tree-serial-type1 {
        /* color: white; */
        height: 4vmin;
        width: 4vmin;
        border-radius: 4vmin;
        text-align: center;
        line-height: 4vmin;
        margin-left: 0vmin;
        border: 1px solid blue;
        /* background-color: rgb(0, 0, 255); */
    }

    .tree-serial-type2 {
        /* color: white; */
        height: 4vmin;
        width: 4vmin;
        /* border-radius: 4vmin; */
        text-align: center;
        line-height: 4vmin;
        margin-left: 0vmin;
        border: 1px solid blue;
        /* background-color: rgb(0, 0, 255); */
    }

    .tree-serial-type3 {
        /* color: white; */
        height: 4vmin;
        width: 4vmin;
        /* border-radius: 4vmin; */
        text-align: center;
        line-height: 4vmin;
        margin-left: 0vmin;
        border: 1px solid blue;
        /* background-color: rgb(0, 0, 255); */
    }

    .tree-serial-type4 {
        /* color: white; */
        height: 4vmin;
        width: 4vmin;
        /* border-radius: 4vmin; */
        text-align: center;
        line-height: 4vmin;
        margin-left: 0vmin;
        border: 1px solid blue;
        background-color: rgb(0, 0, 255);
    }

    .node-content {
        display: flex;
        align-items: center;
        white-space: nowrap;
    }

    .tree-node {
        display: block;
        margin-top: 0.5vmin;
        margin-left: 0vmin;
        white-space: nowrap;
        overflow: auto;
    }

    .tree-children {
        margin-left: 3vmin;
        margin-top: 0.5vmin;
        /* display: none; */
        /* 设置初始展开 */
        display: block;
        width: fit-content;
        overflow: auto;
    }

    .tree-container {
        width: 60%;
        height: 60vmin;
        border: 1px solid black;
        overflow: auto;
    }

    .show {
        display: flex;
    }

    .list-content {
        display: flex;
        align-items: center;
        white-space: nowrap;
    }

    .list {
        display: flex;
        margin: 3vmin 1vmin 1vmin 1vmin;
        margin-left: 3vmin;
        margin-top: 0.5vmin;
        white-space: nowrap;
        overflow: auto;
        width: fit-content;
        align-items: center;
    }

    .lists {
        margin: 0 0 0 2vmin;
        width: 40%;
        height: 60vmin;
        border: 1px solid black;
        display: block;
        overflow: auto;
    }
</style>

<script>
    // 提交按钮
    document.querySelector('.upload').onclick = function () {
        console.log("click upload Btn");

        //新建ajax实例
        var xhrUpload = new XMLHttpRequest();
        const uploadURL = "http://ext.gaomuxuexi.com:5870/task/nodesCommit";
        xhrUpload.open("POST", uploadURL, true);

        //设置请求头
        xhrUpload.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");

        //监听响应
        xhrUpload.onload = function () {
            const rawData = xhr.responseText;
            console.log("返回数据" + rawData);
        }

    }

    // 刷新按钮
    document.querySelector('.download').onclick = function () {
        // 1. 显示学生列表容器
        document.querySelector('.lists').style.display = 'block';

        // 2. 原生AJAX请求数据
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "http://ext.gaomuxuexi.com:5870/task/nodes", false);
        xhr.send();
        result = JSON.parse(xhr.responseText);
        if (result.no === 500) {
            alert(result.msg);
            return;
        }
        console.log(result);
        // 3. 处理列表
        const lists = result.list || [];
        const listsContainer = document.querySelector('.lists');
        listsContainer.innerHTML = '';
        lists.forEach((list, index) => {
            const listDiv = document.createElement('div');
            listDiv.className = "list";

            const serialDiv = document.createElement('div');
            // todo 修改图标
            if (list.type === 1) {
                serialDiv.className = 'tree-serial-type1';
            } else if (list.type === 2) {
                serialDiv.className = 'tree-serial-type2';
            } else if (list.type === 3) {
                serialDiv.className = 'tree-serial-type3';
            } else {
                serialDiv.className = 'tree-serial-type4';
            }
            serialDiv.innerText = index + 1;

            const cardDiv = document.createElement('div');
            cardDiv.className = 'list-content';
            cardDiv.innerText = list.N;

            listDiv.append(serialDiv, cardDiv);
            listsContainer.appendChild(listDiv);
        });

        const treeData = result.tree || [];
        const treeContainer = document.querySelector('.tree-container');
        treeContainer.innerHTML = '';

        function createTreeNode(nodeData) {
            const treeNodeDiv = document.createElement('div');
            treeNodeDiv.className = 'tree-node';

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'toggle-btn';
            toggleBtn.setAttribute('isDisplayed', 'true'); // 初始折叠

            toggleBtn.innerText = '-'; // 初始显示-
            if (!nodeData.C || nodeData.C.length === 0) {
                toggleBtn.style.visibility = 'hidden';
            }

            const treeSerialDiv = document.createElement('div');
            // todo 根据type0-4选择显示图形
            /*
            1-空心圆形
            2-实心圆形
            3-空心方形
            4-实心方形
            */
            // treeSerialDiv.innerText = nodeData.type;
            if (nodeData.type === 1) {
                treeSerialDiv.className = 'tree-serial-type1';
            } else if (nodeData.type === 2) {
                treeSerialDiv.className = 'tree-serial-type2';
            } else if (nodeData.type === 3) {
                treeSerialDiv.className = 'tree-serial-type3';
            } else {
                treeSerialDiv.className = 'tree-serial-type4';
            }

            const nodeDataDiv = document.createElement('div');
            nodeDataDiv.className = 'node-data';
            nodeDataDiv.innerText = nodeData.N;

            const nodeContentDiv = document.createElement('div');
            nodeContentDiv.className = 'node-content';
            nodeContentDiv.append(toggleBtn, treeSerialDiv, nodeDataDiv);

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children';

            treeNodeDiv.append(nodeContentDiv, childrenContainer);

            if (nodeData.C && nodeData.C.length > 0) {
                nodeData.C.forEach(childNode => {
                    childrenContainer.appendChild(createTreeNode(childNode));
                });
            }

            return treeNodeDiv;
        }

        const rootNode = createTreeNode(treeData);
        treeContainer.appendChild(rootNode);

        const toggleButtons = document.querySelectorAll('.toggle-btn');
        toggleButtons.forEach(button => {
            button.onclick = function () {
                const isDisplayed = this.getAttribute('isDisplayed');
                const childrenContainer = this.closest('.tree-node').querySelector('.tree-children');

                if (isDisplayed === 'false') {
                    this.setAttribute('isDisplayed', 'true');
                    this.innerText = '-';
                    childrenContainer.style.display = 'block';
                } else {
                    this.setAttribute('isDisplayed', 'false');
                    this.innerText = '+';
                    childrenContainer.style.display = 'none';
                }
            };
        });
    };
</script>

</html>
