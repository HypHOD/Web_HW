<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW6</title>
</head>

<body>
    <div>
        <div class="show">
            <div class="tree-container">
                <div class="tree-node"></div>
            </div>
            <div class="lists"></div>
        </div>
        <div class="btn-dialog"
            style="margin-top: 1vmin; display:flex; margin-left: auto; justify-content: flex-end; gap: 5px;">
            <button class="download">刷新</button>
            <button class="upload">提交</button>
        </div>
    </div>

    <style>
        .tree-node.drop-target {
            background-color: #e8f4f8;
        }

        .node-content.drop-target {
            border: 1px solid #4299e1;
            border-radius: 0.5vmin;
            padding: 0.2vmin;
        }

        .node-data {
            margin-left: 1vmin;
            color: rgb(85, 85, 85);
            font-size: larger;
            align-items: center;
            overflow: hidden;
            width: fit-content;
        }

        .toggle-btn:hover {
            background-color: rgb(220, 220, 220);
            cursor: pointer;
        }

        .toggle-btn[isDisplayed="true"] {
            background-color: rgb(200, 200, 200);
        }

        .toggle-btn {
            font-size: x-large;
            height: 3vmin;
            width: 3vmin;
            border: 1px dotted rgb(136, 136, 136);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1vmin;
            background-color: white;
            border-radius: 0.5vmin;
            margin-right: 1vmin;
        }

        .tree-serial-type1 {
            height: 4vmin;
            width: 4vmin;
            border-radius: 4vmin;
            text-align: center;
            line-height: 4vmin;
            margin-left: 0vmin;
            border: 1px solid blue;
        }

        .tree-serial-type2 {
            height: 4vmin;
            width: 4vmin;
            text-align: center;
            line-height: 4vmin;
            margin-left: 0vmin;
            border: 1px solid blue;
            background-color: rgb(0, 0, 255);
            border-radius: 0;
        }

        .tree-serial-type3 {
            height: 4vmin;
            width: 4vmin;
            text-align: center;
            line-height: 4vmin;
            margin-left: 0vmin;
            border: 1px solid blue;
            border-radius: 0;
        }

        .tree-serial-type4 {
            height: 4vmin;
            width: 4vmin;
            text-align: center;
            line-height: 4vmin;
            margin-left: 0vmin;
            border: 1px solid blue;
            background-color: rgb(0, 0, 255);
            border-radius: 0;
        }

        .node-content {
            display: flex;
            align-items: center;
            white-space: nowrap;
            cursor: grab;
        }

        .node-content:active {
            cursor: grabbing;
        }

        .tree-node {
            display: block;
            margin-top: 0.5vmin;
            margin-left: 0vmin;
            white-space: nowrap;
            overflow: auto;
        }

        .tree-children {
            margin-left: 3vmin;
            margin-top: 0.5vmin;
            display: block;
            width: fit-content;
            overflow: auto;
        }

        .tree-container {
            width: 60%;
            height: 60vmin;
            border: 1px solid black;
            overflow: auto;
        }

        .tree-node.dragging {
            opacity: 0.5;
            background-color: #f0f0f0;
        }

        .tree-placeholder {
            height: 5vmin;
            width: calc(100% - 6vmin);
            margin: 0.5vmin 0 0.5vmin 3vmin;
            border: 2px dashed #4299e1;
            border-radius: 0.5vmin;
            background-color: #e8f4f8;
        }

        .tree-container.drop-target {
            background-color: #f5fafe;
        }

        .show {
            display: flex;
        }

        .list-content {
            display: flex;
            white-space: nowrap;
            margin-left: 1vmin;
            color: rgb(85, 85, 85);
            font-size: larger;
            align-items: center;
            overflow: hidden;
            width: fit-content;
        }

        .list {
            display: flex;
            margin-top: 0.5vmin;
            margin-left: 1.5vmin;
            white-space: nowrap;
            overflow: auto;
            width: fit-content;
            align-items: center;
            cursor: grab;
        }

        .list:active {
            cursor: grabbing;
        }

        .list.dragging {
            opacity: 0.5;
            background-color: #f0f0f0;
        }

        .list-placeholder {
            height: 5vmin;
            width: calc(100% - 3vmin);
            margin: 0.5vmin 0 0.5vmin 1.5vmin;
            border: 2px dashed #ccc;
            border-radius: 0.5vmin;
            background-color: #f8f8f8;
        }

        .lists {
            margin: 0 0 0 2vmin;
            width: 40%;
            height: 60vmin;
            border: 1px solid black;
            display: block;
            overflow: auto;
        }
    </style>

    <script>
        // 全局变量
        let draggedListData = null;
        let draggedTreeNode = null;
        let treePlaceholder = null;
        let treeData = null;

        // -------------------------- 全局核心函数（修复作用域问题）--------------------------
        // 1. 全局创建树节点函数（原局部函数移到全局，避免无法访问）
        function createTreeNode(nodeData) {
            const treeNodeDiv = document.createElement('div');
            treeNodeDiv.className = 'tree-node';
            // 确保节点ID唯一（兼容接口返回和手动创建）
            const nodeId = nodeData.id || generateUniqueId();
            treeNodeDiv.dataset.nodeData = JSON.stringify({ ...nodeData, id: nodeId });

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'toggle-btn';
            toggleBtn.setAttribute('isDisplayed', 'true');
            toggleBtn.innerText = '-';
            if (!nodeData.C || nodeData.C.length === 0) {
                toggleBtn.style.visibility = 'hidden';
            }

            // 图标样式优化（匹配type定义：1-空心圆，2-实心圆，3-空心方，4-实心方）
            const treeSerialDiv = document.createElement('div');
            if (nodeData.type === 1) {
                treeSerialDiv.className = 'tree-serial-type1';
            } else if (nodeData.type === 2) {
                treeSerialDiv.className = 'tree-serial-type2';
            } else if (nodeData.type === 3) {
                treeSerialDiv.className = 'tree-serial-type3';
            } else {
                treeSerialDiv.className = 'tree-serial-type4';
            }

            const nodeDataDiv = document.createElement('div');
            nodeDataDiv.className = 'node-data';
            nodeDataDiv.innerText = nodeData.N || '未命名';

            const nodeContentDiv = document.createElement('div');
            nodeContentDiv.className = 'node-content';
            nodeContentDiv.append(toggleBtn, treeSerialDiv, nodeDataDiv);

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children';

            treeNodeDiv.append(nodeContentDiv, childrenContainer);

            // 递归创建子节点
            if (nodeData.C && nodeData.C.length > 0) {
                nodeData.C.forEach(childNode => {
                    childrenContainer.appendChild(createTreeNode(childNode));
                });
            }

            // 绑定展开/折叠事件（全局绑定，确保所有节点生效）
            toggleBtn.addEventListener('click', function () {
                const isDisplayed = this.getAttribute('isDisplayed');
                const childrenContainer = this.closest('.tree-node').querySelector('.tree-children');
                if (isDisplayed === 'false') {
                    this.setAttribute('isDisplayed', 'true');
                    this.innerText = '-';
                    childrenContainer.style.display = 'block';
                } else {
                    this.setAttribute('isDisplayed', 'false');
                    this.innerText = '+';
                    childrenContainer.style.display = 'none';
                }
            });

            // 绑定拖拽事件（单个节点）
            nodeContentDiv.addEventListener('dragstart', (e) => {
                draggedTreeNode = treeNodeDiv;
                setTimeout(() => treeNodeDiv.classList.add('dragging'), 0);
                e.dataTransfer.setData('text/plain', JSON.stringify({
                    type: 'treeNode',
                    listCompatible: true,
                    data: { ...nodeData, id: nodeId }
                }));
            });

            nodeContentDiv.addEventListener('dragend', () => {
                draggedTreeNode = null;
                treeNodeDiv.classList.remove('dragging');
                if (treePlaceholder) treePlaceholder.remove();
                treePlaceholder = null;
                document.querySelectorAll('.node-content.drop-target').forEach(el => el.classList.remove('drop-target'));
            });

            nodeContentDiv.draggable = true;
            return treeNodeDiv;
        }

        // 2. 优化唯一ID生成（彻底解决ID重复问题）
        function generateUniqueId() {
            return 'node_' + Date.now() + '_' + Math.floor(Math.random() * 1000000) + '_' + Math.random().toString(36).substr(2, 8);
        }

        // -------------------------- 提交/刷新按钮逻辑 --------------------------
        document.querySelector('.upload').onclick = function () {
            const listsContainer = document.querySelector('.lists');
            const sortedData = listsContainer.dataset.sortedListData
                ? JSON.parse(listsContainer.dataset.sortedListData)
                : JSON.parse(listsContainer.dataset.listData || '[]');

            const updateTreeData = collectTreeData();

            var xhrUpload = new XMLHttpRequest();
            const uploadURL = "http://ext.gaomuxuexi.com:5870/task/nodesCommit";
            xhrUpload.open("POST", uploadURL, true);
            xhrUpload.setRequestHeader("Content-Type", "application/json;charset=utf-8");
            xhrUpload.send(JSON.stringify({
                list: sortedData,
                tree: updateTreeData,
                timestamp: new Date().getTime()
            }));

            xhrUpload.onload = function () {
                const rawData = xhrUpload.responseText;
                console.log("提交返回:", rawData);
                try {
                    const result = JSON.parse(rawData);
                    if (result.no === 200) alert("提交成功!");
                    else alert("提交失败:" + (result.msg || "未知错误"));
                } catch (e) {
                    alert("提交失败");
                    console.error("响应解析错误:", e);
                }
            }
        }

        document.querySelector('.download').onclick = function () {
            document.querySelector('.lists').style.display = 'block';

            // 请求数据
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "http://ext.gaomuxuexi.com:5870/task/nodes", false);
            xhr.send();
            const result = JSON.parse(xhr.responseText);
            if (result.no === 500) {
                alert(result.msg);
                return;
            }

            // 渲染列表
            const lists = result.list || [];
            const listsContainer = document.querySelector('.lists');
            listsContainer.innerHTML = '';
            listsContainer.dataset.listData = JSON.stringify(lists);
            lists.forEach((list, index) => {
                const listDiv = createListItem(list, index);
                listsContainer.appendChild(listDiv);
            });
            initListDragAndDrop();

            // 渲染树（使用全局createTreeNode）
            const treeData = result.tree || [];
            const treeContainer = document.querySelector('.tree-container');
            treeContainer.innerHTML = '';
            if (treeData && treeData.N) {
                // 接口返回单个根节点
                const rootNode = createTreeNode(treeData);
                treeContainer.appendChild(rootNode);
            } else if (Array.isArray(treeData) && treeData.length > 0) {
                // 接口返回多个根节点（罕见情况）
                treeData.forEach(root => {
                    treeContainer.appendChild(createTreeNode(root));
                });
            } else {
                // 空树时创建默认根节点
                const defaultRoot = createTreeNode({
                    N: '默认根节点',
                    type: 1,
                    C: []
                });
                treeContainer.appendChild(defaultRoot);
            }

            // 绑定树容器拖拽事件（全局事件，无需重复绑定节点事件）
            bindTreeContainerDragEvents();
        };

        // -------------------------- 树相关逻辑 --------------------------
        // 树容器拖拽事件（全局绑定，避免重复绑定）
        function bindTreeContainerDragEvents() {
            const treeContainer = document.querySelector('.tree-container');

            // 树容器dragover
            treeContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
                const dragData = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
                const targetNode = getTreeTarget(e);

                // 高亮目标节点
                document.querySelectorAll('.node-content.drop-target').forEach(el => el.classList.remove('drop-target'));
                if (targetNode) targetNode.querySelector('.node-content').classList.add('drop-target');

                // 创建占位符
                if (!treePlaceholder) {
                    treePlaceholder = document.createElement('div');
                    treePlaceholder.className = 'tree-placeholder';
                }

                // 放置占位符
                if (targetNode) {
                    const targetRect = targetNode.getBoundingClientRect();
                    const targetMidY = targetRect.top + targetRect.height / 2;
                    const childrenContainer = targetNode.querySelector('.tree-children');
                    if (e.clientY > targetMidY + 10) {
                        if (!childrenContainer) {
                            const newChildrenContainer = document.createElement('div');
                            newChildrenContainer.className = 'tree-children';
                            targetNode.appendChild(newChildrenContainer);
                            targetNode.querySelector('.toggle-btn').style.visibility = 'visible';
                        }
                        targetNode.querySelector('.tree-children').prepend(treePlaceholder);
                    } else {
                        targetNode.before(treePlaceholder);
                    }
                } else if (treeContainer.firstChild) {
                    treeContainer.firstChild.before(treePlaceholder);
                } else {
                    treeContainer.appendChild(treePlaceholder);
                }
            });

            // 树容器drop
            treeContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                const dragData = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
                const targetNode = getTreeTarget(e);

                // 清理占位符和高亮
                if (treePlaceholder) treePlaceholder.remove();
                treePlaceholder = null;
                document.querySelectorAll('.node-content.drop-target').forEach(el => el.classList.remove('drop-target'));

                // 列表→树
                if (dragData.type === 'listItem') {
                    createNodeFromListData(dragData.data, targetNode, e.clientY);
                }
                // 树→树
                else if (dragData.type === 'treeNode' && draggedTreeNode) {
                    moveTreeNode(draggedTreeNode, targetNode, e.clientY, e);
                }

                updateTreeData();
            });

            // 树容器dragenter（列表→树时高亮）
            treeContainer.addEventListener('dragenter', (e) => {
                e.preventDefault();
                const dragData = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
                if (dragData.type === 'listItem') {
                    treeContainer.classList.add('drop-target');
                }
            });

            // 树容器dragleave
            treeContainer.addEventListener('dragleave', (e) => {
                if (e.target === treeContainer) {
                    treeContainer.classList.remove('drop-target');
                }
            });
        }

        // 列表→树：创建树节点
        function createNodeFromListData(listData, targetNode, clientY) {
            const newTreeNode = createTreeNode({
                N: listData.N,
                type: listData.type,
                C: []
            });

            // 插入新节点
            if (targetNode) {
                const targetRect = targetNode.getBoundingClientRect();
                const targetMidY = targetRect.top + targetRect.height / 2;
                const childrenContainer = targetNode.querySelector('.tree-children');
                if (clientY > targetMidY + 10) {
                    if (!childrenContainer) {
                        const newChildrenContainer = document.createElement('div');
                        newChildrenContainer.className = 'tree-children';
                        targetNode.appendChild(newChildrenContainer);
                        targetNode.querySelector('.toggle-btn').style.visibility = 'visible';
                    }
                    targetNode.querySelector('.tree-children').prepend(newTreeNode);
                } else {
                    targetNode.before(newTreeNode);
                }
            } else {
                const treeContainer = document.querySelector('.tree-container');
                treeContainer.appendChild(newTreeNode);
            }

            // 从列表移除原项（精准匹配ID，避免重复移除）
            const listItems = document.querySelectorAll('.list');
            listItems.forEach(item => {
                const itemData = JSON.parse(item.dataset.listFullData || '{}');
                if (itemData.id === listData.id) {
                    item.remove();
                }
            });

            updateListData();
            updateTreeData();
        }

        // 树节点移动
        function moveTreeNode(draggedNode, targetNode, clientY, e) {
            if (targetNode && isDescendant(targetNode, draggedNode)) return;

            draggedNode.remove();

            if (targetNode) {
                const targetRect = targetNode.getBoundingClientRect();
                const targetMidY = targetRect.top + targetRect.height / 2;
                const childrenContainer = targetNode.querySelector('.tree-children');
                if (e.clientY > targetMidY + 10) {
                    if (!childrenContainer) {
                        const newChildrenContainer = document.createElement('div');
                        newChildrenContainer.className = 'tree-children';
                        targetNode.appendChild(newChildrenContainer);
                        targetNode.querySelector('.toggle-btn').style.visibility = 'visible';
                    }
                    targetNode.querySelector('.tree-children').prepend(draggedNode);
                } else {
                    targetNode.before(draggedNode);
                }
            } else {
                const treeContainer = document.querySelector('.tree-container');
                treeContainer.appendChild(draggedNode);
            }

            updateTreeData();
        }

        // 收集树数据
        function collectTreeData() {
            const treeContainer = document.querySelector('.tree-container');
            const rootNodes = treeContainer.querySelectorAll('.tree-node');

            if (rootNodes.length === 1) {
                return collectNodeData(rootNodes[0]);
            } else if (rootNodes.length > 1) {
                return {
                    id: 'virtual_root',
                    N: '虚拟根节点',
                    type: 1,
                    C: Array.from(rootNodes).map(node => collectNodeData(node))
                };
            } else {
                return {
                    id: 'root',
                    N: '根节点',
                    type: 1,
                    C: []
                };
            }
        }

        function collectNodeData(nodeElement) {
            const nodeData = JSON.parse(nodeElement.dataset.nodeData || '{}');
            const childrenContainer = nodeElement.querySelector('.tree-children');
            const childNodes = childrenContainer ? childrenContainer.querySelectorAll('.tree-node') : [];

            return {
                id: nodeData.id,
                N: nodeData.N,
                type: nodeData.type,
                C: Array.from(childNodes).map(childNode => collectNodeData(childNode))
            };
        }

        function updateTreeData() {
            treeData = collectTreeData();
            console.log("更新后的树数据:", treeData);
        }

        function getTreeTarget(e) {
            const elements = document.querySelectorAll('.tree-node:not(.dragging)');
            let target = null;
            let closestDistance = Infinity;

            elements.forEach(element => {
                const rect = element.getBoundingClientRect();
                if (e.clientY >= rect.top - 10 && e.clientY <= rect.bottom + 10) {
                    const distance = Math.abs(e.clientY - (rect.top + rect.height / 2));
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        target = element;
                    }
                }
            });

            return target;
        }

        function isDescendant(child, parent) {
            let node = child.parentNode;
            while (node) {
                if (node === parent) return true;
                node = node.parentNode;
            }
            return false;
        }

        // -------------------------- 列表相关逻辑 --------------------------
        // 创建列表项（抽离为单独函数，避免重复代码）
        function createListItem(listData, index) {
            const listDiv = document.createElement('div');
            listDiv.className = "list";
            listDiv.draggable = true;
            // 给列表项添加唯一ID（用于精准匹配移除）
            const itemId = listData.id || generateUniqueId();
            listDiv.dataset.listFullData = JSON.stringify({ ...listData, id: itemId });
            listDiv.dataset.index = index;

            const serialDiv = document.createElement('div');
            if (listData.type === 1) serialDiv.className = 'tree-serial-type1';
            else if (listData.type === 2) serialDiv.className = 'tree-serial-type2';
            else if (listData.type === 3) serialDiv.className = 'tree-serial-type3';
            else serialDiv.className = 'tree-serial-type4';

            const cardDiv = document.createElement('div');
            cardDiv.className = 'list-content';
            cardDiv.innerText = listData.N || '未命名';

            listDiv.append(serialDiv, cardDiv);

            // 绑定列表项拖拽事件
            listDiv.addEventListener('dragstart', (e) => {
                setTimeout(() => listDiv.classList.add('dragging'), 0);
                const data = JSON.parse(listDiv.dataset.listFullData || '{}');
                e.dataTransfer.setData('text/plain', JSON.stringify({
                    type: 'listItem',
                    data: data,
                    index: listDiv.dataset.index
                }));
            });

            listDiv.addEventListener('dragend', () => {
                listDiv.classList.remove('dragging');
                const placeholder = document.querySelector('.list-placeholder');
                if (placeholder) placeholder.remove();
            });

            return listDiv;
        }

        function initListDragAndDrop() {
            const listsContainer = document.querySelector('.lists');
            let placeholder = null;

            // 列表容器dragenter
            listsContainer.addEventListener('dragenter', (e) => {
                e.preventDefault();
                const dragData = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
                if (dragData.type === 'listItem' || (dragData.type === 'treeNode' && dragData.listCompatible)) {
                    listsContainer.style.backgroundColor = '#f5fafe';
                }
            });

            // 列表容器dragleave
            listsContainer.addEventListener('dragleave', (e) => {
                if (e.target === listsContainer) {
                    listsContainer.style.backgroundColor = 'transparent';
                }
            });

            // 列表容器dragover（添加passive: false，修复浏览器兼容性）
            listsContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
                const targetItem = getListDragTarget(e);
                const mouseY = e.clientY;

                if (!placeholder) {
                    placeholder = document.createElement('div');
                    placeholder.className = 'list-placeholder';
                }

                if (targetItem) {
                    const targetRect = targetItem.getBoundingClientRect();
                    const targetMidY = targetRect.top + targetRect.height / 2;
                    mouseY < targetMidY ? targetItem.before(placeholder) : targetItem.after(placeholder);
                } else {
                    listsContainer.appendChild(placeholder);
                }
            }, { passive: false });

            // 列表容器drop（核心修复：避免重复创建、精准删除树节点）
            listsContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                const targetItem = getListDragTarget(e);
                let dragData = {};

                try {
                    const dragStr = e.dataTransfer.getData('text/plain') || '{}';
                    dragData = JSON.parse(dragStr);
                } catch (err) {
                    console.error('拖拽数据解析失败：', err);
                    listsContainer.style.backgroundColor = 'transparent';
                    return;
                }

                // 清理占位符
                if (placeholder) {
                    placeholder.remove();
                    placeholder = null;
                }

                // 树→列表（核心修复：精准删除树节点，避免重复插入）
                if (dragData.type === 'treeNode' && dragData.listCompatible) {
                    console.log('树节点拖拽到列表：', dragData.data.N, 'ID:', dragData.data.id);

                    // 1. 创建列表项（仅创建一次）
                    const listDiv = createListItem(dragData.data, listsContainer.querySelectorAll('.list').length);
                    if (targetItem) {
                        const targetMidY = targetItem.getBoundingClientRect().top + targetItem.getBoundingClientRect().height / 2;
                        e.clientY < targetMidY ? targetItem.before(listDiv) : targetItem.after(listDiv);
                    } else {
                        listsContainer.appendChild(listDiv);
                    }

                    // 2. 精准删除树节点（通过ID匹配，仅删除拖拽的节点）
                    const treeNodes = document.querySelectorAll('.tree-node');
                    let deleted = false;
                    treeNodes.forEach(node => {
                        const nodeData = JSON.parse(node.dataset.nodeData || '{}');
                        if (nodeData.id === dragData.data.id && !deleted) {
                            console.log('删除树节点：', nodeData.N);
                            const parentContainer = node.parentNode;
                            node.remove();
                            deleted = true; // 确保只删除一次

                            // 父节点无子节点时隐藏展开按钮
                            if (parentContainer.classList.contains('tree-children')) {
                                const remainingChildren = parentContainer.querySelectorAll('.tree-node');
                                if (remainingChildren.length === 0) {
                                    parentContainer.closest('.tree-node').querySelector('.toggle-btn').style.visibility = 'hidden';
                                }
                            }
                        }
                    });

                    // 3. 树容器为空时创建默认根节点（修复树消失问题）
                    const treeContainer = document.querySelector('.tree-container');
                    if (treeContainer.querySelectorAll('.tree-node').length === 0) {
                        const defaultRoot = createTreeNode({
                            N: '默认根节点',
                            type: 1,
                            C: []
                        });
                        treeContainer.appendChild(defaultRoot);
                        bindTreeContainerDragEvents(); // 重新绑定拖拽事件
                    }

                    // 4. 更新数据并终止函数（避免重复执行）
                    updateListData();
                    updateTreeData();
                    listsContainer.style.backgroundColor = 'transparent';
                    return;
                }

                // 列表→列表排序
                if (dragData.type === 'listItem') {
                    const draggedItem = document.querySelector(`.list[data-list-full-data*="${dragData.data.id}"]`);
                    if (draggedItem && targetItem) {
                        const targetMidY = targetItem.getBoundingClientRect().top + targetItem.getBoundingClientRect().height / 2;
                        e.clientY < targetMidY ? targetItem.before(draggedItem) : targetItem.after(draggedItem);
                    } else if (draggedItem) {
                        listsContainer.appendChild(draggedItem);
                    }
                    updateListData();
                }

                listsContainer.style.backgroundColor = 'transparent';
            });
        }

        // 列表拖拽目标查找（重命名避免冲突）
        function getListDragTarget(e) {
            const listsContainer = document.querySelector('.lists');
            const elements = listsContainer.querySelectorAll('.list:not(.dragging)');
            let target = null;
            let closestDistance = Infinity;

            elements.forEach(element => {
                const rect = element.getBoundingClientRect();
                const distance = Math.abs(e.clientY - (rect.top + rect.height / 2));
                if (distance < closestDistance) {
                    closestDistance = distance;
                    target = element;
                }
            });

            return target;
        }

        // 更新列表数据（同步索引）
        function updateListData() {
            const listsContainer = document.querySelector('.lists');
            const listItems = document.querySelectorAll('.list');

            // 重新同步索引
            listItems.forEach((item, index) => {
                item.dataset.index = index;
            });

            // 生成排序后的数据
            const sortedData = Array.from(listItems).map(item => {
                return JSON.parse(item.dataset.listFullData || '{}');
            });
            listsContainer.dataset.sortedListData = JSON.stringify(sortedData);
            console.log('排序后的列表数据：', sortedData);
        }
    </script>

</body>
